name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        shell: bash
        run: ./mvnw -B -ntp verify

  native:
    name: Native executable (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: pmm
          - os: windows-latest
            exe: pmm.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '21'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Build native executable
        shell: bash
        run: ./mvnw -B -ntp -Pnative -DskipTests package
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          exe="$PWD/pmm-cli/target/${{ matrix.exe }}"
          "$exe" --version
          ws="$RUNNER_TEMP/workspace"
          mkdir -p "$ws/core/.git" "$ws/billing/.git"
          echo '<project/>' > "$ws/core/pom.xml"
          echo '<project/>' > "$ws/billing/pom.xml"
          "$exe" init "$ws"
          "$exe" config --validate --strict --config "$ws/pmm.yaml"
          "$exe" config --config "$ws/pmm.yaml" > /dev/null
          # The repository itself is a real multi-module workspace to read.
          mkdir -p "$RUNNER_TEMP/self-ws" && cp -r "$PWD" "$RUNNER_TEMP/self-ws/pmm"
          "$exe" init "$RUNNER_TEMP/self-ws"
          "$exe" graph --config "$RUNNER_TEMP/self-ws/pmm.yaml"
          "$exe" graph -f mermaid --modules --config "$RUNNER_TEMP/self-ws/pmm.yaml"
          # status may report findings (exit 0-2) on a CI checkout, but must not fail to run (exit 3).
          set +e
          "$exe" status --config "$RUNNER_TEMP/self-ws/pmm.yaml"
          code=$?
          set -e
          test "$code" -le 2
          # No Nexus is configured: deps and doctor skip the release checks but must run.
          set +e
          "$exe" deps --config "$RUNNER_TEMP/self-ws/pmm.yaml"
          code=$?
          set -e
          test "$code" -le 2
          set +e
          "$exe" doctor --no-fetch --config "$RUNNER_TEMP/self-ws/pmm.yaml" \
            --json "$RUNNER_TEMP/reports/pmm.json" --junit "$RUNNER_TEMP/reports/pmm-junit.xml" \
            --html "$RUNNER_TEMP/reports/pmm.html"
          code=$?
          set -e
          test "$code" -le 2
          # Several real repositories: git runs in parallel (this crashed the Windows exe with virtual threads).
          multi="$RUNNER_TEMP/multi-ws"
          for name in core billing reporting invoicing catalog shipping; do
            mkdir -p "$multi/$name"
            printf '<project><modelVersion>4.0.0</modelVersion><groupId>com.example</groupId><artifactId>%s</artifactId><version>1.0.0-SNAPSHOT</version></project>\n' "$name" > "$multi/$name/pom.xml"
            git -C "$multi/$name" init --quiet -b develop
            git -C "$multi/$name" add pom.xml
            git -C "$multi/$name" -c user.name=ci -c user.email=ci@example.com -c commit.gpgsign=false commit --quiet -m init
          done
          "$exe" init "$multi"
          for i in 1 2 3; do
            set +e
            "$exe" doctor --no-fetch --config "$multi/pmm.yaml" > /dev/null
            code=$?
            set -e
            test "$code" -le 2
          done
          # A real Maven build of this repository through its wrapper, then a cache hit.
          "$exe" build --config "$RUNNER_TEMP/self-ws/pmm.yaml"
          "$exe" build --config "$RUNNER_TEMP/self-ws/pmm.yaml" | tee "$RUNNER_TEMP/second-build.txt"
          grep -q "ok (cached)" "$RUNNER_TEMP/second-build.txt"
          "$exe" sync --no-fetch --config "$RUNNER_TEMP/self-ws/pmm.yaml"
          # The CI checkout is a detached HEAD: rebase must refuse it (exit 2), not fail to run (3).
          set +e
          "$exe" rebase pmm --dry-run --no-fetch --config "$RUNNER_TEMP/self-ws/pmm.yaml"
          code=$?
          set -e
          test "$code" -eq 2
          set +e
          "$exe" no-such-command
          code=$?
          set -e
          test "$code" -eq 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmm-reports-${{ runner.os }}
          path: ${{ runner.temp }}/reports/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: pmm-${{ runner.os }}
          path: pmm-cli/target/${{ matrix.exe }}
          if-no-files-found: error
