name: Release

# Pushing a tag vX.Y.Z builds the native executables at version X.Y.Z and publishes them
# as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  native:
    name: Native executable (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            exe: pmm
            asset: linux-x64
          - os: windows-latest
            exe: pmm.exe
            asset: windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '21'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Set the version from the tag
        shell: bash
        run: ./mvnw -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Test and build native executable
        shell: bash
        run: ./mvnw -B -ntp -Pnative package
      - name: Check the version
        shell: bash
        run: |
          set -euo pipefail
          exe="$PWD/pmm-cli/target/${{ matrix.exe }}"
          "$exe" --version | tr -d '\r' | tee "$RUNNER_TEMP/version.txt"
          grep -q "^pmm ${GITHUB_REF_NAME#v}\$" "$RUNNER_TEMP/version.txt"
          mkdir -p dist
          cp "$exe" "dist/pmm-${GITHUB_REF_NAME#v}-${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum pmm-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "pmm ${GITHUB_REF_NAME#v}" --generate-notes ./*
